{{ if and hugo.IsProduction (site.Params.analytics.ga4_id) }}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.Params.analytics.ga4_id }}"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.Params.analytics.ga4_id }}');
    </script>
{{ end }}
